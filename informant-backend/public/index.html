<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Informant</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #12161f;
            --surface-2: #1a212c;
            --border: #252e3c;
            --text: #e9edf3;
            --text-dim: #9aa4b4;
            --text-faint: #66707f;
            --accent: #e8b04b;
            --accent-dim: #8a6a2e;
            --accent-2: #4fb0a5;
            --accent-2-dim: #2c6a63;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .wrap {
            max-width: 640px;
            width: 100%;
        }

        h1 {
            font-family: monospace;
            font-size: 1.3rem;
            margin: 0 0 4px;
        }

        .sub {
            color: var(--text-dim);
            font-size: .9rem;
            margin: 0 0 18px;
        }

        .terminal {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            overflow: hidden;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            font-family: monospace;
            font-size: .85rem;
        }

        .leverage b {
            color: var(--accent);
        }

        .log {
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: .92rem;
            line-height: 1.5;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-2-dim);
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--surface-2);
            border: 1px solid var(--border);
            font-family: monospace;
            font-size: .87rem;
        }

        .msg.system {
            align-self: center;
            color: var(--text-faint);
            font-family: monospace;
            font-size: .78rem;
        }

        .row {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
        }

        input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 9px 11px;
            font-size: .92rem;
        }

        button {
            font-family: monospace;
            padding: 9px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent-dim);
            background: var(--accent);
            color: #1a1406;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>THE INFORMANT</h1>
        <p class="sub">Talking to a real backend at <code>/api/informant</code> — open your browser's Network tab and
            you'll see it, no secrets on this page.</p>
        <div class="terminal">
            <div class="head">
                <span>Team: <b id="teamLabel"></b></span>
                <span class="leverage">Leverage: <b id="leverage">8</b>/8</span>
            </div>
            <div class="log" id="log"></div>
            <div class="row">
                <input id="box" type="text" placeholder="Ask something specific…" autocomplete="off" />
                <button id="send">Ask</button>
            </div>
        </div>
    </div>

    <script>
        const teamId = localStorage.getItem("informant_team_id") ||
            (() => {
                const id = "team-" + Math.random().toString(36).slice(2, 8);
                localStorage.setItem("informant_team_id", id);
                return id;
            })();
        document.getElementById("teamLabel").textContent = teamId;

        const API_BASE = "";

        const log = document.getElementById("log");
        const box = document.getElementById("box");
        const sendBtn = document.getElementById("send");
        const leverageEl = document.getElementById("leverage");

        function addMsg(role, text) {
            const el = document.createElement("div");
            el.className = "msg " + role;
            el.textContent = text;
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;
        }

        async function callBackend(message) {
            const res = await fetch(API_BASE + "/api/informant", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ teamId, message }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || ("HTTP " + res.status));
            }
            return res.json();
        }

        async function send() {
            const text = box.value.trim();
            if (!text) return;
            box.value = "";
            addMsg("user", text);
            sendBtn.disabled = true;
            try {
                const data = await callBackend(text);
                addMsg("bot", data.reply);
                leverageEl.textContent = data.leverage;
                if (data.gameOver) {
                    box.disabled = true;
                    sendBtn.disabled = true;
                    addMsg("system", "The Informant has gone dark.");
                }
            } catch (e) {
                addMsg("system", "Error: " + e.message);
            } finally {
                sendBtn.disabled = false;
                box.focus();
            }
        }

        sendBtn.addEventListener("click", send);
        box.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

        (async () => {
            try {
                const res = await fetch(API_BASE + "/api/informant/" + teamId);
                const data = await res.json();
                leverageEl.textContent = data.leverage;

                if (data.history.length === 0) {
                    const opening = await callBackend(undefined);
                    addMsg("bot", opening.reply);
                    leverageEl.textContent = opening.leverage;
                } else {
                    for (const turn of data.history) {
                        addMsg(turn.role === "user" ? "user" : "bot", turn.text);
                    }
                    if (data.leverage <= 0) {
                        box.disabled = true;
                        sendBtn.disabled = true;
                        addMsg("system", "The Informant has gone dark.");
                    }
                }
            } catch (e) {
                addMsg("system", "Couldn't reach the backend — is server.js running? (" + e.message + ")");
            }
        })();
    </script>
</body>

</html>
